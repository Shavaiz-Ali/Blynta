version: 1
applications:
  - appRoot: apps/app
    frontend:
      phases:
        preBuild:
          commands:
            - cp .amplify.npmrc .npmrc
            - corepack enable
            - corepack prepare pnpm@11.19.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm exec turbo run build --filter=@blynta/app
      buildPath: /
      artifacts:
        baseDirectory: apps/app/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/.pnpm/**/*
          - apps/app/.next/cache/**/*
